name: Build Installers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: install frontend dependencies
        run: npm ci

      # Build-only: no releaseId/tagName is passed, so tauri-action builds the
      # bundles locally and does not touch GitHub Releases. Installers are
      # buyers-only, so they are never attached to a (public) GitHub release —
      # the next step uploads them to a private R2 bucket instead.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO(signing): macOS notarization — set these once an Apple Developer
          # cert exists (Toby-gated). Until then the .app/.dmg are ad-hoc signed
          # and users will see a Gatekeeper "unidentified developer" prompt.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TODO(signing): Windows Authenticode — set once a code-signing cert
          # exists (Toby-gated). Until then the .msi/.exe are unsigned and
          # trigger a Windows SmartScreen warning.
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # TODO(updater): only needed if/when the updater plugin is enabled —
          # see "Updater (auto-update) — recommendation" in DELIVERY-SCOPE.md.
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      # R2's S3-compatible API is used here (not wrangler) because it matches
      # the R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secret pair directly —
      # wrangler r2 object put authenticates with a Cloudflare API token
      # instead, which is a different credential shape. The AWS CLI ships
      # preinstalled on GitHub-hosted macos-latest and windows-latest runners.
      - name: Upload installers to R2 (buyers-only, private)
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TAG" ]; then
            VERSION="$RELEASE_TAG"
          else
            VERSION="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi

          found=0
          while IFS= read -r -d '' f; do
            found=1
            name="$(basename "$f")"
            aws s3 cp "$f" "s3://cvp-installers/${VERSION}/${name}" \
              --endpoint-url "$R2_ENDPOINT"
          done < <(find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
            -path '*/bundle/*' -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::No installer files found under src-tauri/target/**/bundle/ — build likely failed upstream."
            exit 1
          fi
